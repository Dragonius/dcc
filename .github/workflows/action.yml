on:
  push:
  pull_request:
  
jobs:
  Build-make-install:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 19.9.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
     
#      - name: Validate TypeScript and Linting
#        run: |
#          pnpm validate:ts && pnpm validate:lint

      - name: Build Project
        run: |
          pnpm build:ts && pnpm forge:package

      - name: List Files
        run: ls -R ./  # Recursively list all files in the workspace

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v3
        with:
          name: packaged-files
          path: ./forge/dist/  # Replace this with the actual output directory


